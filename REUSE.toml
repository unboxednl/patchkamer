version = 1

[[annotations]]
path = ["patchkamer/**", "devices/**", "app/**", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Freek van Gool"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "contract/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Freek van Gool"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "skins/contract/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Freek van Gool"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["tunes/**", "presets/**", "samples/**", "skins/library/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Freek van Gool"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "songs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Freek van Gool"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorder bevat de MP3-encoder lamejs (LGPL-3.0) onveranderd als tekstconstante LAME_SRC onderaan het bestand
[[annotations]]
path = "devices/tools/Recorder/recorder.patchkamer-device.js"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 Freek van Gool", "lamejs en LAME, zie de kop onderaan het bestand"]
SPDX-License-Identifier = "AGPL-3.0-or-later AND LGPL-3.0-only"

# De host bevat dezelfde lamejs (LGPL-3.0) als los, ongewijzigd bestand; het wordt alleen geladen voor de mp3-omzetting van de Stem Splitter
[[annotations]]
path = "patchkamer/vendor/lame.min.js"
precedence = "override"
SPDX-FileCopyrightText = ["lamejs en LAME, zie https://github.com/zhuker/lamejs"]
SPDX-License-Identifier = "LGPL-3.0-only"
